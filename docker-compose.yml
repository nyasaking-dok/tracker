services:
  postgres:
    image: postgres:16-alpine
    container_name: plaspy-postgres
    environment:
      POSTGRES_USER: plaspy
      POSTGRES_PASSWORD: plaspy
      POSTGRES_DB: plaspy
    ports:
      - '5432:5432'
    volumes:
      - plaspy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plaspy -d plaspy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plaspy_pgdata:
